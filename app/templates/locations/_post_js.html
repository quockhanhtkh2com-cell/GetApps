<script>
    let currentSharePostId = null;
    let shareModalInstance = null;

    // ---------- Modal xác nhận dùng chung (thay cho window.confirm) ----------
    let confirmModalInstance = null;
    function confirmDialog(message, okText) {
        return new Promise((resolve) => {
            const modalEl = document.getElementById('confirmModal');
            if (!confirmModalInstance) {
                confirmModalInstance = new bootstrap.Modal(modalEl);
            }
            document.getElementById('confirmModalMessage').innerText = message;
            const okBtn = document.getElementById('confirmModalOkBtn');
            okBtn.innerText = okText || 'Xóa';

            let settled = false;
            const onOk = () => {
                settled = true;
                confirmModalInstance.hide();
                resolve(true);
            };
            const onHidden = () => {
                okBtn.removeEventListener('click', onOk);
                modalEl.removeEventListener('hidden.bs.modal', onHidden);
                if (!settled) resolve(false);
            };
            okBtn.addEventListener('click', onOk);
            modalEl.addEventListener('hidden.bs.modal', onHidden);
            confirmModalInstance.show();
        });
    }

    function openShareModal(postId) {
        currentSharePostId = postId;
        const modalEl = document.getElementById('shareModal');
        if (!shareModalInstance) {
            shareModalInstance = new bootstrap.Modal(modalEl);
        }
        shareModalInstance.show();
    }

    // ---------- Chỉnh sửa / Xóa bài đăng ----------
    let editPostId = null, editPostModal = null, editCanAdd = 0;
    function openEditPost(el) {
        let d; try { d = JSON.parse(el.dataset.edit || '{}'); } catch (e) { return; }
        editPostId = d.id; editCanAdd = d.can_add_media || 0;
        const $ = id => document.getElementById(id);
        $('epCaption').value = d.caption || '';
        $('epHashtags').value = d.hashtags || '';
        $('epVisibility').value = d.visibility === 'private' ? 'private' : 'public';
        GesPlace.set($('epLocation'), d.location || '', '');
        [0, 1].forEach(i => {
            GesPlace.set($('epExtra' + i), (d.extra_locations || [])[i] || '', '');
            const m = (d.map_links || [])[i] || {};
            $('epMapUrl' + i).value = m.url || '';
            $('epMapLabel' + i).value = m.label || '';
        });
        const f = $('epFiles'); f.value = ''; f.disabled = editCanAdd <= 0;
        $('epMediaHint').textContent = editCanAdd > 0
            ? `Có thể thêm tối đa ${editCanAdd} ảnh/video mới (bài đang có ${d.media_count}/10 file). Ảnh/video đã đăng không sửa được (muốn xóa ảnh: vào tab Album ở trang cá nhân).`
            : 'Không thể thêm ảnh/video mới nữa (tối đa 2 file khi chỉnh sửa, và tổng không quá 10 file). Ảnh/video đã đăng không sửa được (muốn xóa ảnh: vào tab Album ở trang cá nhân).';
        $('epError').classList.add('d-none');
        if (!editPostModal) editPostModal = new bootstrap.Modal($('editPostModal'));
        editPostModal.show();
    }

    async function submitEditPost() {
        const $ = id => document.getElementById(id);
        const err = $('epError'), btn = $('epSubmit');
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        err.classList.add('d-none');
        const files = Array.from($('epFiles').files || []);
        if (files.length > editCanAdd) {
            err.textContent = `Chỉ được thêm tối đa ${editCanAdd} ảnh/video mới.`; err.classList.remove('d-none'); return;
        }
        const links = [];
        [0, 1].forEach(i => {
            const u = $('epMapUrl' + i).value.trim();
            if (u) links.push({ url: u, label: $('epMapLabel' + i).value.trim() });
        });
        const fd = new FormData();
        fd.append('caption', $('epCaption').value);
        fd.append('visibility', $('epVisibility').value);
        fd.append('hashtags', $('epHashtags').value);
        fd.append('location_name', $('epLocation').value.trim());
        fd.append('location_code', GesPlace.code($('epLocation')));
        [0, 1].forEach(i => { const v = $('epExtra' + i).value.trim(); if (v) { fd.append('extra_location_names', v); fd.append('extra_location_codes', GesPlace.code($('epExtra' + i))); } });
        fd.append('map_links', JSON.stringify(links));
        files.forEach(f => fd.append('images', f));
        btn.disabled = true;
        const go = await GesPlace.guard({ kind: 'post', links: links, locations: [$('epLocation'), $('epExtra0'), $('epExtra1')].filter(i => i.value.trim()).map(i => ({ name: i.value.trim(), code: GesPlace.code(i) })) });
        if (!go) { btn.disabled = false; return; }
        try {
            const res = await fetch(`/locations/posts/${editPostId}/edit`, { method: 'POST', headers: { 'X-CSRFToken': csrfToken }, body: fd });
            const data = await res.json().catch(() => ({}));
            if (res.ok) { editPostModal.hide(); window.location.reload(); }
            else { err.textContent = data.error || 'Không lưu được chỉnh sửa.'; err.classList.remove('d-none'); }
        } catch (e) {
            err.textContent = 'Không kết nối được máy chủ.'; err.classList.remove('d-none');
        } finally { btn.disabled = false; }
    }

    async function deletePost(postId, isRepost) {
        const ok = await geAsk({
            title: isRepost ? 'Xóa bài đăng lại?' : 'Xóa bài đăng?',
            note: isRepost
                ? 'Bản đăng lại của bạn sẽ bị xóa. Bài gốc không bị ảnh hưởng.'
                : 'Bài đăng cùng ảnh/video, lượt thích, bình luận, thông báo và các bản đăng lại của người khác sẽ bị xóa vĩnh viễn. Không thể hoàn tác.',
            fields: [], confirmText: 'Xóa', cancelText: 'Hủy'
        });
        if (!ok) return;
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        try {
            const res = await fetch(`/locations/posts/${postId}/delete`, { method: 'POST', headers: { 'X-CSRFToken': csrfToken } });
            const data = await res.json().catch(() => ({}));
            if (res.ok) { window.location.reload(); } else { alert(data.error || 'Không xóa được bài viết.'); }
        } catch (e) { alert('Không kết nối được máy chủ.'); }
    }

    async function executeShareAction(action) {
        if (!currentSharePostId) return;
        const postId = currentSharePostId;
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';

        if (action === 'download') {
            if (shareModalInstance) shareModalInstance.hide();
            window.location.href = `/locations/posts/${postId}/share/download`;
            const countSpan = document.getElementById(`share-count-${postId}`);
            if (countSpan) countSpan.innerText = (parseInt(countSpan.innerText) || 0) + 1;
        } else if (action === 'repost') {
            if (shareModalInstance) shareModalInstance.hide();
            openRepostDialog(postId);
        } else if (action === 'copy') {
            try {
                const res = await fetch(`/locations/posts/${postId}/share`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    }
                });
                const data = await res.json();
                if (shareModalInstance) shareModalInstance.hide();
                const postUrl = data.link || `${window.location.origin}/locations/feed#post-article-${postId}`;
                navigator.clipboard.writeText(postUrl).then(() => {
                    gesToast("Đã sao chép liên kết bài viết!");
                }).catch(() => {
                    prompt("Sao chép liên kết bên dưới:", postUrl);
                });
                const countSpan = document.getElementById(`share-count-${postId}`);
                if (countSpan) countSpan.innerText = (parseInt(countSpan.innerText) || 0) + 1;
            } catch (err) {
                console.error("Lỗi chia sẻ:", err);
                copyPostLink(postId);
                if (shareModalInstance) shareModalInstance.hide();
            }
        }
    }

    // ---------- Đăng lại (Repost) có xác nhận ----------
    let repostModalInstance = null, repostPostId = null, repostVis = 'public', repostLocked = false;

    function setRepostVis(v) {
        if (repostLocked) v = 'private';
        repostVis = v;
        document.getElementById('repostVisPublic').classList.toggle('active', v === 'public');
        document.getElementById('repostVisPrivate').classList.toggle('active', v === 'private');
    }

    function openRepostDialog(postId) {
        repostPostId = postId;
        const art = document.getElementById(`post-article-${postId}`);
        repostLocked = !!art && art.dataset.repostLocked === '1';
        document.getElementById('repostNote').value = '';
        document.getElementById('repostNoteCount').innerText = '0';
        document.getElementById('repostError').classList.add('d-none');
        document.getElementById('repostLockHint').classList.toggle('d-none', !repostLocked);
        document.getElementById('repostVisPublic').disabled = repostLocked;
        setRepostVis(repostLocked ? 'private' : 'public');
        if (!repostModalInstance) repostModalInstance = new bootstrap.Modal(document.getElementById('repostModal'));
        repostModalInstance.show();
    }

    document.addEventListener('input', function (e) {
        if (e.target && e.target.id === 'repostNote') document.getElementById('repostNoteCount').innerText = e.target.value.length;
    });

    async function submitRepost() {
        const btn = document.getElementById('repostSubmitBtn');
        const errBox = document.getElementById('repostError');
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        errBox.classList.add('d-none');
        btn.disabled = true;
        try {
            const res = await fetch(`/locations/posts/${repostPostId}/repost`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ visibility: repostVis, note: document.getElementById('repostNote').value })
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                repostModalInstance.hide();
                window.location.reload();
            } else {
                errBox.innerText = data.error || 'Không thể đăng lại bài viết!';
                errBox.classList.remove('d-none');
            }
        } catch (err) {
            errBox.innerText = 'Đã xảy ra lỗi khi đăng lại!';
            errBox.classList.remove('d-none');
        } finally {
            btn.disabled = false;
        }
    }

    function copyPostLink(postId) {
        const postUrl = `${window.location.origin}/locations/feed#post-article-${postId}`;
        navigator.clipboard.writeText(postUrl).then(() => {
            gesToast("Đã sao chép liên kết bài viết!");
        }).catch(() => {
            prompt("Sao chép liên kết bên dưới:", postUrl);
        });
    }

    // AJAX: Thả tim / Bỏ tim (Like/Unlike)
    async function toggleLike(postId) {
        try {
            const res = await fetch(`/locations/posts/${postId}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await res.json();
            if (res.ok) {
                const btn = document.getElementById(`like-btn-${postId}`);
                const icon = document.getElementById(`like-icon-${postId}`);
                const countSpan = document.getElementById(`like-count-${postId}`);
                let currentCount = parseInt(countSpan.innerText) || 0;

                if (data.liked) {
                    btn.classList.add('liked');
                    icon.classList.remove('bi-heart');
                    icon.classList.add('bi-heart-fill');
                    countSpan.innerText = currentCount + 1;
                } else {
                    btn.classList.remove('liked');
                    icon.classList.remove('bi-heart-fill');
                    icon.classList.add('bi-heart');
                    countSpan.innerText = Math.max(0, currentCount - 1);
                }
            }
        } catch (err) {
            console.error("Lỗi thả tim:", err);
        }
    }

    // ---------- Thả tim bình luận ----------
    async function toggleCommentLike(btn) {
        const cid = btn.dataset.cid;
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        try {
            const res = await fetch(`/locations/api/comments/${cid}/like`, { method: 'POST', headers: { 'X-CSRFToken': csrfToken } });
            if (!res.ok) return;
            const data = await res.json();
            btn.classList.toggle('on', !!data.is_liked);
            btn.querySelector('i').className = 'bi ' + (data.is_liked ? 'bi-heart-fill' : 'bi-heart');
            btn.querySelector('span').textContent = data.likes_count || '';
        } catch (e) {}
    }

    // ---------- Trả lời bình luận ----------
    const replyContext = {};   // postId -> { parentId, username }

    function replyToComment(postId, parentId, username) {
        replyContext[postId] = { parentId: parentId, username: username };
        const ctx = document.getElementById(`reply-context-${postId}`);
        const nameEl = document.getElementById(`reply-context-name-${postId}`);
        if (ctx && nameEl) {
            nameEl.innerText = '@' + username;
            ctx.classList.remove('d-none');
        }
        const input = document.getElementById(`comment-input-${postId}`);
        if (input) { input.focus(); }
    }

    // Thu gọn / mở khung trả lời (kiểu "Xem N phản hồi" của Facebook)
    function toggleReplies(commentId) {
        const box = document.getElementById(`comment-replies-${commentId}`);
        const btn = document.getElementById(`replies-toggle-${commentId}`);
        if (!box || !btn) return;
        const willShow = box.classList.contains('d-none');
        box.classList.toggle('d-none');
        const count = box.querySelectorAll('.comment-reply').length;
        btn.innerHTML = willShow
            ? `<i class="bi bi-arrow-return-right"></i> Ẩn phản hồi`
            : `<i class="bi bi-arrow-return-right"></i> Xem ${count} phản hồi`;
    }

    function cancelReply(postId) {
        delete replyContext[postId];
        const ctx = document.getElementById(`reply-context-${postId}`);
        if (ctx) ctx.classList.add('d-none');
    }

    function currentUserAvatarHtml() {
        {% if current_user.is_authenticated %}
        const url = {{ (current_user.avatar_url or '') | tojson }};
        const initial = {{ (current_user.username[0]|upper if current_user.username else 'U') | tojson }};
        {% else %}
        const url = '';
        const initial = 'U';
        {% endif %}
        return url
            ? `<img src="${url}" alt="" class="avatar avatar-sm flex-shrink-0">`
            : `<span class="avatar-placeholder avatar-sm flex-shrink-0">${initial}</span>`;
    }

    // AJAX: Thêm bình luận (Comment) — hỗ trợ cả bình luận gốc lẫn trả lời (1 cấp)
    async function submitComment(event, postId) {
        event.preventDefault();
        const input = document.getElementById(`comment-input-${postId}`);
        const content = input.value.trim();
        if (!content) return;

        const ctx = replyContext[postId];

        try {
            const res = await fetch(`/locations/posts/${postId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, parent_id: ctx ? ctx.parentId : null })
            });
            const data = await res.json();
            if (res.ok) {
                input.value = '';
                // Cập nhật số lượng bình luận
                const countSpan = document.getElementById(`comment-count-${postId}`);
                countSpan.innerText = (parseInt(countSpan.innerText) || 0) + 1;

                const c = data.comment;
                const avatarHtml = currentUserAvatarHtml();
                const authorName = escapeHtml(c.author_username || '{{ current_user.username }}');

                if (c.parent_id) {
                    // Trả lời -> chèn lồng dưới bình luận gốc (tạo khung + nút thu gọn nếu chưa có)
                    let repliesBox = document.getElementById(`comment-replies-${c.parent_id}`);
                    let toggleBtn = document.getElementById(`replies-toggle-${c.parent_id}`);
                    const thread = document.getElementById(`comment-thread-${c.parent_id}`);
                    if (!toggleBtn && thread) {
                        toggleBtn = document.createElement('button');
                        toggleBtn.type = 'button';
                        toggleBtn.className = 'btn btn-sm btn-link text-muted p-0 ps-1 replies-toggle-btn';
                        toggleBtn.id = `replies-toggle-${c.parent_id}`;
                        toggleBtn.onclick = function () { toggleReplies(c.parent_id); };
                        thread.appendChild(toggleBtn);
                    }
                    if (!repliesBox && thread) {
                        repliesBox = document.createElement('div');
                        repliesBox.className = 'comment-replies';
                        repliesBox.id = `comment-replies-${c.parent_id}`;
                        thread.appendChild(repliesBox);
                    }
                    const mentionHtml = c.reply_to_name
                        ? `<a href="/profile/${encodeURIComponent(c.reply_to_username || '')}" class="text-decoration-none reply-mention">@${escapeHtml(c.reply_to_name)}</a> `
                        : '';
                    const replyHtml = `
                        <div class="comment-box comment-reply d-flex align-items-start gap-2" id="comment-item-${c.id}">
                            ${avatarHtml}
                            <div class="flex-grow-1">
                                <div class="comment-name">
                                    <a href="/profile/${encodeURIComponent(c.author_username || '{{ current_user.username }}')}" class="text-decoration-none"><strong class="text-dark">${authorName}</strong></a>
                                </div>
                                <div class="comment-text">${mentionHtml}${c.content_html || escapeHtml(c.content)}</div>
                                <div class="d-flex align-items-center gap-2 text-muted" style="font-size: 0.72rem; margin-top: 2px;">
                                    <span>Vừa xong</span>
                                    <button type="button" class="btn btn-sm btn-link p-0 cmt-like-btn" data-cid="${c.id}" onclick="toggleCommentLike(this)"><i class="bi bi-heart"></i> <span></span></button>
                                    <button type="button" class="btn btn-sm btn-link text-muted p-0 reply-btn" onclick="replyToComment(${postId}, ${c.id}, '${authorName}')">Trả lời</button>
                                </div>
                            </div>
                            <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2" title="Xóa bình luận" onclick="deleteComment(${c.id}, ${postId})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    `;
                    if (repliesBox) {
                        repliesBox.insertAdjacentHTML('beforeend', replyHtml);
                        repliesBox.classList.remove('d-none');   // tự mở khung ra vì mình vừa trả lời
                        if (toggleBtn) {
                            const count = repliesBox.querySelectorAll('.comment-reply').length;
                            toggleBtn.innerHTML = `<i class="bi bi-arrow-return-right"></i> Ẩn phản hồi (${count})`;
                        }
                    }
                } else {
                    // Bình luận gốc -> thêm vào cuối danh sách
                    const list = document.getElementById(`comments-list-${postId}`);
                    const newCommentHtml = `
                        <div class="comment-thread" id="comment-thread-${c.id}">
                            <div class="comment-box d-flex align-items-start gap-2" id="comment-item-${c.id}">
                                ${avatarHtml}
                                <div class="flex-grow-1">
                                    <div class="comment-name">
                                        <a href="/profile/${encodeURIComponent(c.author_username || '{{ current_user.username }}')}" class="text-decoration-none"><strong class="text-dark">${authorName}</strong></a>
                                    </div>
                                    <div class="comment-text">${c.content_html || escapeHtml(c.content)}</div>
                                    <div class="d-flex align-items-center gap-2 text-muted" style="font-size: 0.72rem; margin-top: 2px;">
                                        <span>Vừa xong</span>
                                        <button type="button" class="btn btn-sm btn-link p-0 cmt-like-btn" data-cid="${c.id}" onclick="toggleCommentLike(this)"><i class="bi bi-heart"></i> <span></span></button>
                                        <button type="button" class="btn btn-sm btn-link text-muted p-0 reply-btn" onclick="replyToComment(${postId}, ${c.id}, '${authorName}')">Trả lời</button>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2" title="Xóa bình luận" onclick="deleteComment(${c.id}, ${postId})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', newCommentHtml);
                }

                cancelReply(postId);
            } else {
                alert(data.error || "Không thể gửi bình luận");
            }
        } catch (err) {
            console.error("Lỗi gửi bình luận:", err);
        }
    }

    // AJAX: Xóa bình luận
    async function deleteComment(commentId, postId) {
        if (!(await confirmDialog("Bạn có chắc chắn muốn xóa bình luận này?"))) return;

        try {
            const res = await fetch(`/locations/comments/${commentId}`, {
                method: 'DELETE'
            });
            const data = await res.json();
            if (res.ok) {
                // Xóa bình luận gốc -> gỡ luôn khung chứa trả lời bên dưới nó; xóa reply -> chỉ gỡ đúng dòng đó
                const thread = document.getElementById(`comment-thread-${commentId}`);
                if (thread) { thread.remove(); }
                else {
                    const item = document.getElementById(`comment-item-${commentId}`);
                    const repliesBox = item ? item.closest('.comment-replies') : null;
                    if (item) item.remove();
                    if (repliesBox) {
                        const parentThread = repliesBox.closest('.comment-thread');
                        const toggleBtn = parentThread ? parentThread.querySelector('.replies-toggle-btn') : null;
                        const remaining = repliesBox.querySelectorAll('.comment-reply').length;
                        if (remaining === 0) {
                            repliesBox.remove();
                            if (toggleBtn) toggleBtn.remove();
                        } else if (toggleBtn) {
                            const hidden = repliesBox.classList.contains('d-none');
                            toggleBtn.innerHTML = hidden
                                ? `<i class="bi bi-arrow-return-right"></i> Xem ${remaining} phản hồi`
                                : `<i class="bi bi-arrow-return-right"></i> Ẩn phản hồi`;
                        }
                    }
                }
                const countSpan = document.getElementById(`comment-count-${postId}`);
                const count = parseInt(countSpan.innerText) || 0;
                countSpan.innerText = Math.max(0, count - (data.deleted_count || 1));
            } else {
                alert(data.error || "Không thể xóa bình luận");
            }
        } catch (err) {
            console.error("Lỗi xóa bình luận:", err);
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ----- Lightbox cho ảnh nhiều tấm (collage) -----
    (function () {
        let box = null, items = [], idx = 0;
        function build() {
            box = document.createElement('div');
            box.className = 'ges-lb';
            box.setAttribute('role', 'dialog');
            box.setAttribute('aria-modal', 'true');
            box.innerHTML = '<button type="button" class="lb-close" aria-label="Đóng"><i class="bi bi-x-lg"></i></button>' +
                '<button type="button" class="lb-prev" aria-label="Ảnh trước"><i class="bi bi-chevron-left"></i></button>' +
                '<div class="ges-lb-stage"></div>' +
                '<button type="button" class="lb-next" aria-label="Ảnh sau"><i class="bi bi-chevron-right"></i></button>' +
                '<div class="lb-count"></div>';
            document.body.appendChild(box);
            box.addEventListener('click', function (e) {
                if (e.target === box || e.target.classList.contains('ges-lb-stage')) close();
            });
            box.querySelector('.lb-close').onclick = close;
            box.querySelector('.lb-prev').onclick = function () { go(-1); };
            box.querySelector('.lb-next').onclick = function () { go(1); };
        }
        function render() {
            const it = items[idx], stage = box.querySelector('.ges-lb-stage');
            stage.textContent = '';
            const el = document.createElement(it.type === 'video' ? 'video' : 'img');
            if (it.type === 'video') { el.controls = true; el.autoplay = true; el.playsInline = true; }
            el.src = it.src;
            if (it.type !== 'video') el.alt = 'Ảnh ' + (idx + 1);
            stage.appendChild(el);
            box.querySelector('.lb-count').textContent = (idx + 1) + ' / ' + items.length;
            const multi = items.length > 1;
            box.querySelector('.lb-prev').style.display = multi ? 'flex' : 'none';
            box.querySelector('.lb-next').style.display = multi ? 'flex' : 'none';
        }
        function go(d) { idx = (idx + d + items.length) % items.length; render(); }
        function open(list, i) {
            if (!box) build();
            items = list; idx = i; render();
            box.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        function close() {
            if (!box) return;
            box.classList.remove('show');
            box.querySelector('.ges-lb-stage').textContent = '';   // dừng video đang phát
            document.body.style.overflow = '';
        }
        document.addEventListener('click', function (e) {
            const cell = e.target.closest ? e.target.closest('.ges-collage .ges-cell') : null;
            if (!cell) return;
            const wrap = cell.closest('[data-collage]');
            const list = Array.prototype.map.call(wrap.querySelectorAll('[data-src]'), function (n) {
                return { src: n.getAttribute('data-src'), type: n.getAttribute('data-type') };
            });
            open(list, list.findIndex(function (x) { return x.src === cell.getAttribute('data-src'); }));
        });
        document.addEventListener('keydown', function (e) {
            if (!box || !box.classList.contains('show')) return;
            if (e.key === 'Escape') close();
            else if (e.key === 'ArrowLeft') go(-1);
            else if (e.key === 'ArrowRight') go(1);
        });
        let sx = null;
        document.addEventListener('touchstart', function (e) { if (box && box.classList.contains('show')) sx = e.touches[0].clientX; }, { passive: true });
        document.addEventListener('touchend', function (e) {
            if (sx === null) return;
            const dx = e.changedTouches[0].clientX - sx; sx = null;
            if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
        }, { passive: true });
    })();

    // ---------- Emoji Picker cho Bình luận Bài viết ----------
    function toggleCommentEmojiPicker(e, postId) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        const picker = document.getElementById(`emoji-picker-${postId}`);
        if (!picker) return;
        const willShow = picker.classList.contains('d-none');
        document.querySelectorAll('.cmt-emoji-picker').forEach(p => p.classList.add('d-none'));
        if (willShow) {
            picker.classList.remove('d-none');
        }
    }

    function insertCommentEmoji(postId, emoji) {
        const input = document.getElementById(`comment-input-${postId}`);
        if (!input) return;
        const start = input.selectionStart !== undefined ? input.selectionStart : input.value.length;
        const end = input.selectionEnd !== undefined ? input.selectionEnd : input.value.length;
        const text = input.value;
        input.value = text.substring(0, start) + emoji + text.substring(end);
        input.selectionStart = input.selectionEnd = start + emoji.length;
        input.focus();
        input.dispatchEvent(new Event('input', { bubbles: true }));
        const picker = document.getElementById(`emoji-picker-${postId}`);
        if (picker) picker.classList.add('d-none');
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.cmt-emoji-picker') && !e.target.closest('.cmt-emoji-btn')) {
            document.querySelectorAll('.cmt-emoji-picker').forEach(p => p.classList.add('d-none'));
        }
    });
</script>
